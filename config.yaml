name: "Puente MQTT a MSSQL"
version: "2028.08.01"
slug: "mqtt2mssql-cfm"
description: "Escucha datos por MQTT y ejecuta INSERTS complejos en MSSQL usando pyodbc nativo"
arch:
  - amd64
  - aarch64
init: false
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mssql_server: "192.168.1.X"
  mssql_port: 1433
  mssql_database: "TuBaseDatos"
  mssql_user: "TuUsuario"
  mssql_password: "TuContraseña"
schema:
  mqtt_host: str
  mqtt_port: int
  mssql_server: str
  mssql_port: int
  mssql_database: str
  mssql_user: str
  mssql_password: password # Al poner 'password', Home Assistant oculta el texto en la interfaz por seguridadbuild_from:
  amd64: "ghcr.io/home-assistant/amd64-base-alpine:3.19"
  aarch64: "ghcr.io/home-assistant/aarch64-base-alpine:3.19"
