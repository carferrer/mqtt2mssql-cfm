name: Crear Release Automática

on:
  push:
    branches:
      - main  # Cambia por tu rama principal si usas 'master'
    paths:
      - 'config.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Registrar repositorio
      uses: actions/checkout@v4.2.2

    - name: Leer versión desde config.yaml
      id: get_version
      run: |
        # Busca la línea 'version:' en config.yaml y limpia las comillas
        VERSION=$(grep -E '^version:' config.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Verificar si el Tag ya existe
      id: check_tag
      run: |
        git fetch --tags
        if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "La versión v${{ steps.get_version.outputs.version }} ya tiene una release asignada."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Crear GitHub Release
      if: steps.check_tag.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2.0.1
      with:
        token: ${{ secrets.PARA_GERERAR_RELEASES }}  # Tu Fine-grained PAT con permiso Read/Write en Contents
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Release ${{ steps.get_version.outputs.version }}
        generate_release_notes: true  # Genera el changelog web de forma automática
        draft: false
        prerelease: false
